{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Connexion</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100">Se connecter</button>
        </form>
        <p class="mt-3 mb-0">Pas de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
