{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Inscription</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100">Créer mon compte</button>
        </form>
        <p class="mt-3 mb-0">Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
