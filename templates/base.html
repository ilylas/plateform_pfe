<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plateforme PFE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">Plateforme PFE</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-white">{{ user.username }} · {{ user.get_role_display }}</span>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button class="btn btn-light btn-sm">Déconnexion</button>
          </form>
        {% else %}
          <a class="btn btn-light btn-sm" href="{% url 'login' %}">Connexion</a>
          <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Inscription</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
